# 로컬 개발용: MySQL + MOARI 백엔드를 한 번에 실행
#   docker compose up --build
# 값은 같은 폴더의 .env 파일에서 읽고, 없으면 아래 기본값(로컬 전용)을 쓴다.

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      # 앱 전용 계정 (권한은 docker/mysql/02-grant.sql에서 부여)
      MYSQL_USER: moari
      MYSQL_PASSWORD: ${DB_PASSWORD:-moaripass}
    # 한글 깨짐 방지
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      # 컨테이너가 처음 만들어질 때 파일 이름 순서대로 자동 실행된다.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/02-grant.sql:/docker-entrypoint-initdb.d/02-grant.sql:ro
      # DB 데이터는 볼륨에 보관 → 컨테이너를 지워도 데이터 유지
      - db-data:/var/lib/mysql
    ports:
      # PC에 MySQL이 이미 깔려 있을 수 있어서 3306 대신 3307로 노출
      - "3307:3306"
    healthcheck:
      # -h 127.0.0.1(TCP)로 확인해야 한다. localhost(소켓)로 하면 schema.sql을 적용하는
      # 초기화용 임시 서버(TCP 닫힘)에도 응답해서, 준비가 덜 된 상태에서 healthy가 된다.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  be:
    build: .
    environment:
      PORT: 3000
      DB_HOST: db            # 같은 compose 네트워크 안에서는 서비스 이름이 곧 호스트 이름
      DB_USER: moari
      DB_PASSWORD: ${DB_PASSWORD:-moaripass}
      DB_NAME: moari_db
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      # 아래 값이 비어 있으면 AI·메일 기능만 동작하지 않고 서버는 뜬다.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
    depends_on:
      db:
        condition: service_healthy   # MySQL이 준비된 뒤에 백엔드 시작
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  db-data:
  uploads:
